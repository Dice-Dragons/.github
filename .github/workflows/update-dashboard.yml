name: "Update Suite Dashboard"

on:
  schedule:
    - cron: "0 3 * * *" # Täglich um 03:00 Uhr UTC
  workflow_dispatch:   # Manueller "Run workflow"-Button auf GitHub

jobs:
  update-dashboard:
    name: "Regenerate Profile Dashboard"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROFILE_PAT }}

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: json, curl

      - name: Regenerate Dashboard Table
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
        run: |
          php scripts/update-dashboard.php

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain profile/README.md)" ]; then
            git add profile/README.md
            git commit -m "chore: update organization suite dashboard [skip ci]"
            git push origin main
            echo "Dashboard successfully updated and pushed."
          else
            echo "Dashboard is already up to date. No changes to push."
          fi
